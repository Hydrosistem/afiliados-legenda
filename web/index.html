<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffe600">
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" href="icon-192.png?v=2">
<title>Gerador de Post</title>
<style>
  :root { --amarelo: #ffe600; --texto: #222; --cinza: #6b6b6b; --borda: #d9d9d9; --fundo: #f5f5f5; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--texto); background: var(--fundo); }
  header {
    background: linear-gradient(135deg, #ffec3d 0%, #ffd000 55%, #ffb000 100%);
    padding: calc(18px + env(safe-area-inset-top)) 16px 20px;
    border-radius: 0 0 24px 24px;
    box-shadow: 0 6px 20px rgba(160, 100, 0, .18);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .marca { display: flex; align-items: center; gap: 12px; }
  header img { width: 46px; height: 46px; border-radius: 14px; border: 2.5px solid #fff; box-shadow: 0 4px 12px rgba(120, 70, 0, .28); }
  header h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.3px; line-height: 1.15; }
  header p { margin: 2px 0 0; font-size: 12.5px; font-weight: 500; color: rgba(34, 34, 34, .68); }
  /* Sacolas nas cores de várias lojas: mostra que serve para qualquer loja, sem escrever nomes. */
  .lojas { display: flex; justify-content: center; gap: 8px; }
  .lojas span { width: 32px; height: 32px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(120, 70, 0, .2); }
  .lojas svg { width: 17px; height: 17px; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  label { display: block; font-size: 13px; color: var(--cinza); margin-bottom: 4px; }
  input, textarea { width: 100%; padding: 12px; font: inherit; border: 1px solid var(--borda); border-radius: 10px; background: #fff; }
  textarea { min-height: 190px; resize: vertical; line-height: 1.4; }
  button { font: inherit; font-weight: 600; padding: 13px 16px; border: 0; border-radius: 10px; background: var(--amarelo); color: var(--texto); cursor: pointer; }
  button.sec { background: #fff; border: 1px solid var(--borda); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .linha { display: flex; gap: 8px; }
  .linha > * { flex: 1; }
  .linha > button { flex: 0 0 auto; }
  .linha > .emoji { flex: 0 0 76px; }
  .precos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #aviso { min-height: 20px; font-size: 14px; color: var(--cinza); }
  #aviso.erro { color: #b3261e; }
  #previa { width: 100%; max-height: 260px; object-fit: contain; background: #fff; border: 1px solid var(--borda); border-radius: 10px; }
  [hidden] { display: none !important; }
  #conta { display: flex; align-items: center; justify-content: space-between; gap: 10px; max-width: 560px; margin: 10px auto 0; padding: 0 16px; font-size: 13px; color: var(--cinza); }
  #conta button { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
  #telaLogin { max-width: 560px; margin: 28px auto; padding: 0 16px; display: grid; gap: 14px; text-align: center; }
  #telaLogin p { color: var(--cinza); font-size: 14.5px; margin: 0; }
  #botaoGoogle { display: flex; justify-content: center; }
  #avisoLogin { min-height: 20px; font-size: 14px; color: var(--cinza); }
  #avisoLogin.erro { color: #b3261e; }
  #config { border: 1px solid var(--borda); border-radius: 10px; padding: 10px 14px 14px; background: #fff; }
  #config summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
  #config label { margin-top: 10px; }
  #config p { font-size: 12.5px; color: var(--cinza); margin: 10px 0 0; }
  #config a { color: var(--texto); }
  #statusChave { font-size: 13px; color: var(--cinza); margin: 10px 0 0; font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="marca">
    <img src="icon-192.png?v=2" alt="" width="46" height="46">
    <div>
      <h1>Gerador de Post</h1>
      <p>Achadinhos e ofertas</p>
    </div>
  </div>
  <div class="lojas" aria-hidden="true">
    <svg width="0" height="0" style="position:absolute">
      <symbol id="sacola" viewBox="0 0 24 24">
        <path d="M5.5 8h13l-1.1 12.2a1 1 0 0 1-1 .8H7.6a1 1 0 0 1-1-.8L5.5 8z" fill="currentColor"/>
        <path d="M9 10V7a3 3 0 0 1 6 0v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </symbol>
    </svg>
    <span style="color:#2d3277"><svg><use href="#sacola"/></svg></span>
    <span style="color:#ee4d2d"><svg><use href="#sacola"/></svg></span>
    <span style="color:#ff9900"><svg><use href="#sacola"/></svg></span>
    <span style="color:#0086ff"><svg><use href="#sacola"/></svg></span>
    <span style="color:#e91e63"><svg><use href="#sacola"/></svg></span>
  </div>
</header>

<div id="conta" hidden>
  <span>Olá, <strong id="nomeConta"></strong></span>
  <button id="sair" type="button" class="sec">Sair</button>
</div>

<div id="telaLogin" hidden>
  <p>Entre com a conta Google usada na compra.</p>
  <div id="botaoGoogle"></div>
  <div id="avisoLogin" role="status"></div>
</div>

<main id="app" hidden>
  <div>
    <label for="link">Link de afiliado</label>
    <div class="linha">
      <input id="link" type="url" inputmode="url" placeholder="https://meli.la/..." autocomplete="off">
      <button id="gerar" type="button">Gerar</button>
    </div>
  </div>
  <div id="blocoProduto" hidden>
    <label for="produto">Link do produto (o link curto não abriu o produto)</label>
    <input id="produto" type="url" inputmode="url" placeholder="https://www.mercadolivre.com.br/..." autocomplete="off">
  </div>
  <div id="aviso" role="status"></div>
  <img id="previa" alt="Imagem do produto" hidden>
  <div class="linha">
    <div>
      <label for="titulo">Título</label>
      <input id="titulo" type="text" autocomplete="off">
    </div>
    <div class="emoji">
      <label for="emoji">Emoji</label>
      <input id="emoji" type="text" autocomplete="off">
    </div>
  </div>
  <div class="precos">
    <div><label for="preco">Preço atual</label><input id="preco" type="text" inputmode="decimal" placeholder="149,90" autocomplete="off"></div>
    <div><label for="precoAntigo">Preço antigo</label><input id="precoAntigo" type="text" inputmode="decimal" placeholder="199,90" autocomplete="off"></div>
  </div>
  <div>
    <label for="frase">Frase de efeito 💗</label>
    <input id="frase" type="text" placeholder="Ex.: Toque macio e conforto gostoso pra transformar seu sono!!" autocomplete="off">
  </div>
  <div>
    <label for="legenda">Legenda</label>
    <textarea id="legenda"></textarea>
  </div>
  <div class="linha">
    <button id="copiar" type="button">Copiar legenda</button>
  </div>
  <button id="compartilhar" type="button" class="sec" disabled>Compartilhar imagem</button>

  <details id="config">
    <summary>⚙️ Sua chave do Gemini (frase automática)</summary>
    <label for="chaveGemini">Chave do Gemini</label>
    <input id="chaveGemini" type="password" placeholder="Cole sua chave aqui" autocomplete="off">
    <div class="linha">
      <button id="salvarChave" type="button">Salvar</button>
      <button id="apagarChave" type="button" class="sec">Apagar</button>
    </div>
    <p id="statusChave"></p>
    <p><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">Criar chave grátis</a></p>
    <p>A chave fica só neste aparelho e vai direto para o Gemini.</p>
  </details>
</main>

<script src="caption.js"></script>
<script id="scriptGoogle" src="https://accounts.google.com/gsi/client" async></script>
<script src="frase.js"></script>
<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbzH4coDv1Xl1mFLOnETUP5jRLA93kGO4EpQ6z12aaEuFSqrTOl9HTPe9nd4vAWe9AjbCg/exec';
var GOOGLE_CLIENT_ID = 'COLE_AQUI_O_CLIENT_ID';
var LS_TOKEN_ANTIGO = 'afl_token';
var LS_SESSAO = 'gp_sessao';
var LS_NOME = 'gp_nome';
var LS_GEMINI = 'gp_gemini';
var imagemUrl = null;

function $(id) { return document.getElementById(id); }

function lerLS(chave) { try { return localStorage.getItem(chave); } catch (e) { return null; } }
function gravarLS(chave, valor) { try { localStorage.setItem(chave, valor); } catch (e) {} }
function apagarLS(chave) { try { localStorage.removeItem(chave); } catch (e) {} }

function aviso(msg, erro) {
  $('aviso').textContent = msg || '';
  $('aviso').className = erro ? 'erro' : '';
}

function avisoLogin(msg, erro) {
  $('avisoLogin').textContent = msg || '';
  $('avisoLogin').className = erro ? 'erro' : '';
}

function mostrarTelaLogin() {
  $('app').hidden = true;
  $('conta').hidden = true;
  $('telaLogin').hidden = false;
  renderizarBotaoGoogle();
}

function mostrarApp(nome) {
  $('telaLogin').hidden = true;
  $('nomeConta').textContent = nome || '';
  $('conta').hidden = false;
  $('app').hidden = false;
}

// Apaga a sessão local e volta para a tela de login, com um aviso opcional.
function voltarLogin(msg, erro) {
  apagarLS(LS_SESSAO);
  apagarLS(LS_NOME);
  mostrarTelaLogin();
  avisoLogin(msg, erro);
}

// POST simples (sem Content-Type, pra não disparar preflight de CORS). A sessão guardada
// neste aparelho vai em todo pedido; o servidor confere e devolve 'sessao'/'sem_acesso' quando cai.
async function api(params) {
  var sessao = lerLS(LS_SESSAO);
  var resp = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ sessao: sessao }, params)) });
  var r = await resp.json();
  if (!r.ok && (params.action === 'info' || params.action === 'img')) {
    if (r.erro === 'sessao') {
      voltarLogin('Sua sessão terminou (sua conta entrou em outro aparelho). Entre de novo.', true);
    } else if (r.erro === 'sem_acesso') {
      voltarLogin('Seu acesso foi desativado. Fale com quem te vendeu o Gerador de Post.', true);
    }
  }
  return r;
}

var googleCarregado = false;

// Chamado quando o script do Google termina de carregar, e de novo (sem custo) se ele já tiver
// carregado. Sempre inicializa e desenha o botão, mesmo com sessão: a tela de login pode
// reaparecer depois (Sair, sessão derrubada) e o app instalado não tem botão de recarregar.
function iniciarGoogle() {
  if (typeof google === 'undefined' || !google.accounts || !google.accounts.id) return;
  if (!googleCarregado) {
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: aoLogar });
    googleCarregado = true;
  }
  renderizarBotaoGoogle();
}

// Redesenha o botão do zero (evita duplicar) sempre que a tela de login aparece ou o script carrega.
function renderizarBotaoGoogle() {
  if (!googleCarregado) return;
  $('botaoGoogle').innerHTML = '';
  google.accounts.id.renderButton($('botaoGoogle'), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'pt-BR' });
}

async function aoLogar(resp) {
  avisoLogin('Entrando…');
  var r;
  try {
    r = await api({ action: 'login', idToken: resp.credential });
  } catch (e) {
    avisoLogin('Não consegui confirmar seu login. Tente de novo.', true);
    return;
  }
  if (r.ok) {
    gravarLS(LS_SESSAO, r.sessao);
    gravarLS(LS_NOME, r.nome);
    mostrarApp(r.nome);
  } else if (r.erro === 'sem_acesso') {
    avisoLogin('Este e-mail não tem acesso. Fale com quem te vendeu o Gerador de Post.', true);
  } else {
    avisoLogin('Não consegui confirmar seu login. Tente de novo.', true);
  }
}

function numeroParaCampo(n) {
  return typeof n === 'number' && isFinite(n) ? n.toFixed(2).replace('.', ',') : '';
}

function limparProduto() {
  $('titulo').value = '';
  $('preco').value = '';
  $('precoAntigo').value = '';
  $('frase').value = '';
  $('emoji').value = '';
  imagemUrl = null;
  $('previa').hidden = true;
  $('previa').removeAttribute('src');
  $('compartilhar').disabled = true;
}

function reiniciarBlocoProduto() {
  $('blocoProduto').hidden = true;
  $('produto').value = '';
}

function atualizarLegenda() {
  var link = $('link').value.trim();
  $('legenda').value = montarLegenda({
    titulo: $('titulo').value.trim(),
    emoji: $('emoji').value.trim(),
    frase: $('frase').value.trim(),
    preco: parseValor($('preco').value),
    precoAntigo: parseValor($('precoAntigo').value),
    link: link
  });
}

function mostrarErro(r) {
  if (r.erro === 'host') aviso('Cole um link do Mercado Livre.', true);
  else if (r.erro === 'link_curto') {
    $('blocoProduto').hidden = false;
    aviso('Não achei o produto nesse link. Cole também o link do produto.', true);
  } else aviso('Não consegui ler a página. Preencha os campos à mão.', true);
}

async function gerar() {
  var link = $('link').value.trim();
  if (!link) { aviso('Cole o link de afiliado.', true); return; }
  if (API_URL.indexOf('COLE_AQUI') === 0) { aviso('Configure API_URL no index.html.', true); return; }
  var origem = $('blocoProduto').hidden ? link : ($('produto').value.trim() || link);
  $('gerar').disabled = true;
  limparProduto();
  aviso('Buscando…');
  try {
    var r = await api({ action: 'info', url: origem });
    if (r.erro === 'sessao' || r.erro === 'sem_acesso') return;
    if (!r.ok) { mostrarErro(r); atualizarLegenda(); return; }
    $('titulo').value = r.titulo || '';
    $('preco').value = numeroParaCampo(r.preco);
    $('precoAntigo').value = numeroParaCampo(r.precoAntigo);
    imagemUrl = r.imagem || null;
    $('previa').hidden = !imagemUrl;
    if (imagemUrl) $('previa').src = imagemUrl;
    $('compartilhar').disabled = !imagemUrl;
    reiniciarBlocoProduto();
    atualizarLegenda();

    var titulo = $('titulo').value.trim();
    if (!titulo) { aviso('Sem frase de efeito automática. Digite a frase abaixo.'); return; }
    aviso('Criando a frase…');
    var f = await gerarFrase(titulo, lerLS(LS_GEMINI) || '');
    $('frase').value = f.frase || '';
    $('emoji').value = f.emoji || '';
    atualizarLegenda();
    if (f.erro === 'sem_chave') aviso('Sem chave do Gemini: digite a frase ou configure a chave em ⚙️.');
    else if (f.erro === 'chave') aviso('O Gemini recusou sua chave. Confira em ⚙️.', true);
    else if (f.erro === 'limite') aviso('Limite do Gemini atingido. Tente daqui a pouco ou digite a frase.', true);
    else if (f.erro === 'rede' || f.erro === 'formato') aviso('Não consegui criar a frase. Digite abaixo.', true);
    else aviso('');
  } catch (e) {
    aviso('Falha de rede. Tente de novo ou preencha à mão.', true);
    atualizarLegenda();
  } finally {
    $('gerar').disabled = false;
  }
}

async function copiarLegenda() {
  var texto = $('legenda').value;
  try {
    await navigator.clipboard.writeText(texto);
  } catch (e) {
    $('legenda').select();
    document.execCommand('copy');
  }
  aviso('Legenda copiada.');
}

async function compartilharImagem() {
  if (!imagemUrl) return;
  aviso('Baixando imagem…');
  try {
    var r = await api({ action: 'img', url: imagemUrl });
    if (r.erro === 'sessao' || r.erro === 'sem_acesso') return;
    if (!r.ok) { aviso('Não consegui baixar a imagem. Abrindo em outra aba.', true); window.open(imagemUrl, '_blank'); return; }
    var bytes = Uint8Array.from(atob(r.base64), function (c) { return c.charCodeAt(0); });
    var arquivo = new File([bytes], 'produto.' + (r.mime.split('/')[1] || 'jpg'), { type: r.mime });
    if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
      try { await navigator.share({ files: [arquivo] }); } catch (e) {}
    } else {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(arquivo);
      a.download = arquivo.name;
      a.click();
    }
    aviso('');
  } catch (e) {
    aviso('Falha de rede ao baixar a imagem.', true);
  }
}

function atualizarStatusChave() {
  $('statusChave').textContent = lerLS(LS_GEMINI) ? 'Chave salva' : 'Sem chave';
}

function salvarChave() {
  var v = $('chaveGemini').value.trim();
  if (!v) return;
  gravarLS(LS_GEMINI, v);
  $('chaveGemini').value = '';
  atualizarStatusChave();
}

function apagarChave() {
  apagarLS(LS_GEMINI);
  $('chaveGemini').value = '';
  atualizarStatusChave();
}

function iniciar() {
  apagarLS(LS_TOKEN_ANTIGO);
  var sessao = lerLS(LS_SESSAO);
  if (sessao) {
    mostrarApp(lerLS(LS_NOME));
  } else {
    mostrarTelaLogin();
  }
  atualizarStatusChave();
}

$('gerar').addEventListener('click', gerar);
$('copiar').addEventListener('click', copiarLegenda);
$('compartilhar').addEventListener('click', compartilharImagem);
$('salvarChave').addEventListener('click', salvarChave);
$('apagarChave').addEventListener('click', apagarChave);
$('sair').addEventListener('click', function () {
  api({ action: 'sair' })['catch'](function () {});
  voltarLogin('');
});
['titulo', 'emoji', 'frase', 'preco', 'precoAntigo'].forEach(function (id) { $(id).addEventListener('input', atualizarLegenda); });
$('link').addEventListener('input', function () { reiniciarBlocoProduto(); atualizarLegenda(); });

iniciar();

// O script do Google é async: anexa os listeners aqui (depois de iniciarGoogle já existir, sem
// depender de atributo onload) e cobre tanto o caso de já ter carregado quanto o de falhar.
var scriptGoogle = $('scriptGoogle');
if (scriptGoogle) {
  scriptGoogle.addEventListener('load', iniciarGoogle);
  scriptGoogle.addEventListener('error', function () {
    avisoLogin('Não consegui carregar o login do Google. Verifique a conexão e recarregue.', true);
  });
}
iniciarGoogle();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
